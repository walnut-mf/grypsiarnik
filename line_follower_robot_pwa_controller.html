<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Line Follower</title>
  
  <!-- PWA & Mobile Settings -->
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Line Follower">
  
  <!-- Embedded Web App Manifest -->
  <link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Line%20Follower%20Control%22%2C%22short_name%22%3A%22Line%20Follower%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D'http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg'%2520viewBox%253D'0%25200%2520512%2520512'%253E%253Crect%2520width%253D'512'%2520height%253D'512'%2520fill%253D'%2523000000'%252F%253E%253Ccircle%2520cx%253D'256'%2520cy%253D'256'%2520r%253D'180'%2520fill%253D'none'%2520stroke%253D'%252300f2fe'%2520stroke-width%253D'32'%252F%253E%253Cpath%2520d%253D'M180%2520360%2520L256%2520160%2520L332%2520360'%2520fill%253D'none'%2520stroke%253D'%252300f2fe'%2520stroke-width%253D'32'%2520stroke-linecap%253D'round'%2520stroke-linejoin%253D'round'%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: 12px 16px;
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1f1f23;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #8e8e93;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1c1c1e;
      color: #8e8e93;
    }

    .status-badge.connected {
      background: rgba(48, 209, 88, 0.15);
      color: #30d158;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8e8e93;
    }

    .status-badge.connected .status-dot {
      background: #30d158;
      box-shadow: 0 0 8px #30d158;
    }

    /* Action Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1.4fr 1fr 1fr;
      gap: 10px;
      flex: 1;
    }

    .btn {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      border: 1px solid #2c2c2e;
      background: #1c1c1e;
      color: #fff;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.97);
      background: #2c2c2e;
    }

    .btn-main {
      grid-column: span 2;
      background: #0a84ff;
      border: none;
      font-size: 1.5rem;
      box-shadow: 0 4px 20px rgba(10, 132, 255, 0.25);
    }

    .btn-main.running {
      background: #ff453a;
      box-shadow: 0 4px 20px rgba(255, 69, 58, 0.25);
    }

    .btn-secondary {
      grid-column: span 2;
      background: #121214;
      border: 1px solid #27272a;
    }

    .btn-subtext {
      font-size: 0.7rem;
      font-weight: 500;
      opacity: 0.6;
    }

    /* Connect & Install Buttons */
    .action-bar {
      display: flex;
      gap: 8px;
    }

    .btn-connect {
      flex: 1;
      padding: 12px;
      background: #2c2c2e;
      border: none;
      border-radius: 12px;
      color: #0a84ff;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-install {
      display: none;
      padding: 12px;
      background: #30d158;
      color: #000;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Sensors Modal / Card */
    .sensor-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      z-index: 100;
      padding: 24px 16px;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .sensor-panel.active {
      display: flex;
    }

    .sensor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: #2c2c2e;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
    }

    .sensor-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      align-items: center;
      padding: 20px 0;
    }

    .sensor-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .sensor-led {
      width: 100%;
      height: 48px;
      border-radius: 6px;
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
    }

    .sensor-led.active {
      background: #30d158;
      border-color: #30d158;
      box-shadow: 0 0 12px rgba(48, 209, 88, 0.6);
    }

    .sensor-pin {
      font-size: 0.65rem;
      color: #8e8e93;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <span class="title">Line Follower</span>
      <div id="statusBadge" class="status-badge">
        <div class="status-dot"></div>
        <span id="statusText">DISCONNECTED</span>
      </div>
    </header>

    <div class="controls-grid">
      <button id="mainToggleBtn" class="btn btn-main" onclick="toggleStart()">
        <span id="mainBtnText">START</span>
        <span class="btn-subtext" id="mainBtnSub">CMD: 'S'</span>
      </button>

      <button class="btn" onclick="sendCommand('L')">
        <span>CLEAN LEFT</span>
        <span class="btn-subtext">JOG MOTOR [L]</span>
      </button>

      <button class="btn" onclick="sendCommand('R')">
        <span>CLEAN RIGHT</span>
        <span class="btn-subtext">JOG MOTOR [R]</span>
      </button>

      <button class="btn btn-secondary" onclick="openSensors()">
        <span>CHECK SENSORS</span>
        <span class="btn-subtext">8-CHANNEL ARRAY</span>
      </button>
    </div>

    <div class="action-bar">
      <button id="connectBtn" class="btn-connect" onclick="connectBT()">CONNECT BOT</button>
      <button id="installBtn" class="btn-install" onclick="installApp()">INSTALL APP</button>
    </div>
  </div>

  <!-- Sensor Array Modal -->
  <div id="sensorModal" class="sensor-panel">
    <div class="sensor-header">
      <span style="font-size: 1.1rem; font-weight: 700;">Sensor Array Monitor</span>
      <button class="close-btn" onclick="closeSensors()">Close</button>
    </div>
    
    <div class="sensor-grid" id="sensorContainer"></div>

    <p style="font-size: 0.8rem; color: #8e8e93; text-align: center;">
      Pins: 34, 35, 32, 33, 25, 26, 4, 15
    </p>
  </div>

  <script>
    let bluetoothDevice = null;
    let gattServer = null;
    let txCharacteristic = null;
    let isRunning = false;
    let deferredPrompt = null;

    // Render sensor array layout
    const sensorPins = [34, 35, 32, 33, 25, 26, 4, 15];
    const sensorContainer = document.getElementById('sensorContainer');
    
    sensorPins.forEach((pin, index) => {
      const item = document.createElement('div');
      item.className = 'sensor-item';
      item.innerHTML = `
        <div class="sensor-led" id="led-${index}"></div>
        <span class="sensor-pin">${pin}</span>
      `;
      sensorContainer.appendChild(item);
    });

    // Handle PWA Installation
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });

    async function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('installBtn').style.display = 'none';
        }
        deferredPrompt = null;
      }
    }

    // Bluetooth Web API Connection
    async function connectBT() {
      if (!navigator.bluetooth) {
        alert('Web Bluetooth is not supported on this browser. Try Chrome on Android.');
        return;
      }

      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '00001101-0000-1000-8000-00805f9b34fb', // Serial SPP
            '6e400001-b5a3-f393-e0a9-e50e24dcca9e'  // Nordic UART
          ]
        });

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
        gattServer = await bluetoothDevice.gatt.connect();

        // Update UI
        document.getElementById('statusBadge').classList.add('connected');
        document.getElementById('statusText').innerText = 'CONNECTED';
        document.getElementById('connectBtn').innerText = 'DISCONNECT';
        document.getElementById('connectBtn').onclick = disconnectBT;

      } catch (error) {
        console.error('Bluetooth connection failed:', error);
      }
    }

    function disconnectBT() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      document.getElementById('statusBadge').classList.remove('connected');
      document.getElementById('statusText').innerText = 'DISCONNECTED';
      document.getElementById('connectBtn').innerText = 'CONNECT BOT';
      document.getElementById('connectBtn').onclick = connectBT;
    }

    async function sendCommand(cmd) {
      if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
        console.log('Sending offline test command:', cmd);
        return;
      }

      try {
        // Send single ASCII character command to ESP32
        const encoder = new TextEncoder();
        const services = await gattServer.getPrimaryServices();
        if (services.length > 0) {
          const characteristics = await services[0].getCharacteristics();
          if (characteristics.length > 0) {
            await characteristics[0].writeValue(encoder.encode(cmd));
          }
        }
      } catch (err) {
        console.error('Failed to send character command:', err);
      }
    }

    function toggleStart() {
      const btn = document.getElementById('mainToggleBtn');
      const text = document.getElementById('mainBtnText');
      const sub = document.getElementById('mainBtnSub');

      if (!isRunning) {
        sendCommand('S');
        btn.classList.add('running');
        text.innerText = 'STOP';
        sub.innerText = "CMD: 'X'";
        isRunning = true;
      } else {
        sendCommand('X');
        btn.classList.remove('running');
        text.innerText = 'START';
        sub.innerText = "CMD: 'S'";
        isRunning = false;
      }
    }

    function openSensors() {
      document.getElementById('sensorModal').classList.add('active');
    }

    function closeSensors() {
      document.getElementById('sensorModal').classList.remove('active');
    }
  </script>
</body>
</html>
